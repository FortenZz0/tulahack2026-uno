# Include inside the existing HTTPS server block for tg.filinda.ru.
# Other paths on this domain keep their existing handlers.
location ^~ /exoplanet-api/ {
    # Fixed upstream and a route allowlist; this is not a general-purpose proxy.
    if ($uri !~ "^/exoplanet-api/(preview|full|planets|stars|desc)$") {
        return 404;
    }

    # Resolve IPv4 dynamically; this VPS has no IPv6 route.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $worker_host tulahack2026-uno-exoworker.dfilirini.workers.dev;

    # Strip the prefix without changing query parameters (including the planet ID).
    rewrite ^/exoplanet-api/(.*)$ /$1 break;
    proxy_pass https://$worker_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host tulahack2026-uno-exoworker.dfilirini.workers.dev;

    proxy_ssl_server_name on;
    proxy_ssl_name tulahack2026-uno-exoworker.dfilirini.workers.dev;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 5;
    # Debian/Ubuntu CA bundle; use the distribution's CA bundle on other OSes.
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 200s;

    # CORS and Cache-Control are supplied by the Worker itself.
    proxy_cache off;
}
