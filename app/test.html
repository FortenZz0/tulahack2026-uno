
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Топ-20 экзопланет по ESI</title>
</head>
<body>
    <h1>Топ-20 экзопланет по ESI</h1>

    <ol id="planets">
        <li>Загрузка...</li>
    </ol>

    <script type="module">
        import { ExoplanetLibrary } from "./lib/exoplanet-library.js";

        const list = document.getElementById("planets");

        try {
            const library = new ExoplanetLibrary();
            await library.init();

            const planets = library.getPlanets({
                sort: {
                    by: "esi.full",
                    order: "desc"
                },
                limit: 20
            });

            list.replaceChildren();

            for (const planet of planets) {
                const item = document.createElement("li");

                item.textContent =
                    `${planet.name} — ESI: ${planet.esi.full?.toFixed(4) ?? "нет данных"}`;

                list.append(item);
            }
        } catch (error) {
            list.replaceChildren();

            const item = document.createElement("li");
            item.textContent = `Ошибка загрузки: ${error.message}`;
            list.append(item);

            console.error(error);
        }
    </script>
</body>
</html>
