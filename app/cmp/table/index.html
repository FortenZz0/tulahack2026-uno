<span class="d-block m-0 mb-2 accent">
    Рейтинг ESI / PHI
</span>

<h1 class="m-0 mb-4" id="vizual-planet-name">
    Топ 50 планет
</h1>

<label class="search-field w-100 mb-3" for="search">
    <input type="text" name="search" id="search" class="fs-4">
    <span class="placeholder">
        <i class="fa-solid fa-magnifying-glass"></i>Поиск...
    </span>
</label>


<div class="planets-list d-flex justify-content-between align-items-center">
    <div class="header">
        <span>Планеты</span>
    </div>

    <div class="d-flex p-0 gap-3">
        <div class="checkbox p-y px-2 d-flex gap-3" data-active="ESI" role="group" aria-label="Выбор рейтинга">
            <button type="button" data-option="ESI">ESI</button>
            <button type="button" data-option="PHI">PHI</button>
        </div>
        <span>
            <i class="fa-solid fa-filter"></i>
        </span>
    </div>
</div>


<div class="planets-list">

    <div class="planet-card d-flex align-items-center justify-content-between mb-3 selected">
        <div class="d-flex align-items-center h-100">
            <div class="index d-flex justify-content-center align-items-center me-2">
                <span class="fs-4">
                    1
                </span>
            </div>

            <div class="name">
                <h5 class="mb-0">
                    Kepler-452b
                </h5>
                <span class="">
                    <i class="fa-regular fa-star"></i> Kepler-452
                </span>
            </div>
        </div>

        <div class="values h-100 d-flex align-items-center gap-3">
            <div class="esi d-flex flex-column align-items-center good">
                <span class="val">
                    0.83
                </span>
                <span class="desc">
                    ESI
                </span>
            </div>

            <div class="phi d-flex flex-column align-items-center bad">
                <span class="val">
                    0.45
                </span>
                <span class="desc">
                    PHI
                </span>
            </div>
        </div>
    </div>

    <div class="planet-card d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center h-100">
            <div class="index d-flex justify-content-center align-items-center me-2">
                <span class="fs-4">
                    1
                </span>
            </div>

            <div class="name">
                <h5 class="mb-0">
                    Kepler-452b
                </h5>
                <span class="">
                    <i class="fa-regular fa-star"></i> Kepler-452
                </span>
            </div>
        </div>

        <div class="values h-100 d-flex align-items-center gap-3">
            <div class="esi d-flex flex-column align-items-center good">
                <span class="val">
                    0.83
                </span>
                <span class="desc">
                    ESI
                </span>
            </div>

            <div class="phi d-flex flex-column align-items-center bad">
                <span class="val">
                    0.45
                </span>
                <span class="desc">
                    PHI
                </span>
            </div>
        </div>
    </div>

</div>
