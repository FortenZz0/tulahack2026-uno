{% import "./app/cmp/data.njk" as data %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link rel="shortcut icon" href="./logo.png" type="image/x-icon">

    <!-- JQUERY -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- NORMALIZE.CSS -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
    <!-- WOW -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
</head>
<body class="color-sheme-1_black">

    {% include "./app/cmp/header/index.html" %}


    <main class="container-xl">
        <div class="main-grid-container">

            <section class="block" style="grid-area: table">

            </section>

            <section class="block planet-info d-flex w-100" style="grid-area: vizual">
                {% include "./app/cmp/canvas/index.html" %}

                <div class="content p-4 ps-1 w-100">
                    <div class="d-flex justify-content-between w-100 mb-1">
                        <h1 class="m-0 fs-1" id="vizual-planet-name">
                            Kepler-452b
                        </h1>

                        <span class="m-0" id="vizual-research-date">
                            13/11/2026
                        </span>
                    </div>

                    <span class="m-0 accent" id="vizual-sun-name">
                        <i class="fa-solid fa-star"></i> Kepler-452
                    </span>
                </div>
            </section>

            <section class="block" style="grid-area: info">

            </section>

            <section class="block" style="grid-area: stats">

            </section>

        </div>
    </main>

    <!-- FONT AWESOME -->
    <script src="https://kit.fontawesome.com/54fe1a9d85.js" crossorigin="anonymous"></script>
    <!-- BOOTSTRAP.JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <!-- MAIN.JS -->
    <script src="main.js" type="module"></script>
</body>
</html>
